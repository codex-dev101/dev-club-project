<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Exam Results - Smart CBT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="result.css">
    <link rel="icon" type="image/svg+xml" href="../image/favicon.svg">
</head>

<body>
    <!-- Top Header Navigation -->
    <header class="header">
        <div class="brand-group">
            <i class="fa-solid fa-graduation-cap"></i>
            <h1>Smart CBT</h1>
        </div>
        <nav>
            <a href="../../index.html"><i class="fa-solid fa-house"></i> Home</a>
            <a href="../creator-dashboard/creator-dashboard.html"><i class="fa-solid fa-sliders"></i> Creator Studio</a>
            <a href="../select-subject/select-subject.html"><i class="fa-solid fa-pen-to-square"></i> Take Exam</a>
            <a href="result.html" class="active"><i class="fa-solid fa-chart-column"></i> My Results</a>
        </nav>
    </header>

    <main class="results-container">
        <div class="results-header-bar">
            <div class="results-title-group">
                <h1>My All-Time Results</h1>
                <p class="description">
                    Complete history of tests written, candidate IDs, attempt retakes, and detailed score breakdowns.
                </p>
            </div>
            <div>
                <button type="button" id="btnClearHistory" class="btn-clear-history">
                    <i class="fa-solid fa-trash-can"></i> Clear History
                </button>
            </div>
        </div>

        <div class="table-responsive-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Candidate & ID</th>
                        <th>Exam Subject</th>
                        <th>Attempt</th>
                        <th>Date Taken</th>
                        <th>Score & Grade</th>
                        <th>Performance</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="resultsTable">
                    <!-- Populated dynamically -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Review Answers Modal for past results -->
    <div id="reviewModal" class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header-navy">
                <h3 id="modalExamTitle">
                    <i class="fa-solid fa-list-check"></i> Detailed Answers Review
                </h3>
                <button type="button" id="btnCloseModal" class="btn-close-modal-icon">&times;</button>
            </div>

            <div class="modal-scrollable-body" id="modalQuestionsList">
                <!-- Question cards injected here -->
            </div>

            <div class="modal-footer-gray">
                <button type="button" id="btnCloseModalBottom" class="btn-close-modal">Close</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="result.js"></script>
</body>

</html>
