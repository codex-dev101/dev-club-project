<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CBT Examination System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <main class="container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <img src="logo.png" alt="Logo">
                </div>

                <div>
                    <h2>Smart CBT</h2>
                    <p>Examination System</p>
                </div>
            </div>


            <!-- Introduction -->
            <div class="intro">

                <h1>SMART CBT</h1>

                <h2>
                    EXAMINATION & RESULT<br>
                    MANAGEMENT SYSTEM
                </h2>

                <div class="yellow-line"></div>

                <p class="description">
                    A simple, efficient and reliable
                    computer based testing system
                    for students and institutions.
                </p>

            </div>


            <!-- Illustration -->
            <div class="illustration">
                <img src="image.png" alt="Illustration">
            </div>

        </section>



        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-card">

                <h1>
                    Welcome Back! <span>👋</span>
                </h1>

                <p class="subtitle">
                    Enter your details to start your exam
                </p>


                <!-- Form -->
                <form action="exam instruct/einstruct.html">

                    <!-- Candidate Unique Identifier -->
                    <div class="input-box" style="position: relative;">
                        <span class="input-icon"><i class="fa-solid fa-id-card"></i></span>
                        <input type="text" name="candidateId" id="candidateId" placeholder="Candidate ID / Matric No." required>
                        <button type="button" id="btnGenId" title="Generate random Candidate ID" style="background: none; border: none; color: #2563eb; font-size: 12px; font-weight: 700; cursor: pointer; padding: 0 4px; white-space: nowrap;">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> Auto
                        </button>
                    </div>

                    <!-- Name -->
                    <div class="input-box">
                        <span class="input-icon"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="fullname" id="candidateName" placeholder="Enter your full name" required>
                    </div>

                    <!-- Exam Subject / Custom Pack -->
                    <div class="input-box">
                        <span class="input-icon"><i class="fa-solid fa-book-open"></i></span>
                        <select name="subject" id="subjectSelect" title="Select your subject" required>
                            <option value="" disabled selected>Select your subject</option>
                            <optgroup label="Standard Subjects">
                                <option value="math">Mathematics</option>
                                <option value="english">English</option>
                                <option value="science">Science</option>
                                <option value="art">Art</option>
                                <option value="current_affairs">Current Affairs</option>
                                <option value="general_knowledge">General Knowledge</option>
                            </optgroup>
                            <optgroup label="User Created & Custom Packs" id="customSubjectsOptgroup">
                                <!-- Populated dynamically from creator packs -->
                            </optgroup>
                        </select>
                    </div>

                    <!-- Duplicate Attempt Notice Banner (Hidden by default) -->
                    <div id="attemptNoticeBanner" style="display: none; background: #fff7ed; border: 1px solid #fdba74; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; text-align: left; font-size: 12.5px; color: #9a3412;">
                        <div style="display: flex; align-items: center; gap: 6px; font-weight: 700; margin-bottom: 2px;">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <span id="attemptNoticeTitle">Retake Notice</span>
                        </div>
                        <p id="attemptNoticeDesc" style="margin: 0; line-height: 1.35; color: #c2410c;">You have written this exam before.</p>
                    </div>

                    <!-- Start Exam -->
                    <button class="start-btn" type="submit">
                        <span>Start Exam</span>
                        <i class="fa-solid fa-arrow-right arrow"></i>
                    </button>

                </form>

                <!-- OR -->
                <div class="or">
                    <span></span>
                    <p>OR</p>
                    <span></span>
                </div>

                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <!-- Question Creator Dashboard Link -->
                    <a href="creator-dashboard.html" class="creator-btn-link">
                        <button class="result-btn" type="button" style="background: #eef2ff; border-color: #c7d2fe; color: #3730a3;">
                            <span class="result-icon"><i class="fa-solid fa-graduation-cap"></i></span>
                            <span>Question Creator Studio</span>
                        </button>
                    </a>

                    <!-- Results -->
                    <a href="henry's-part/result.html" class="result-btn-link">
                        <button class="result-btn" type="button">
                            <span class="result-icon"><i class="fa-solid fa-chart-column"></i></span>
                            <span>View My Results</span>
                        </button>
                    </a>
                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
