<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CBT Examination System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <main class="container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <img src="logo.png" alt="Logo">
                </div>

                <div>
                    <h2>Smart CBT</h2>
                    <p>Examination System</p>
                </div>
            </div>


            <!-- Introduction -->
            <div class="intro">

                <h1>SMART CBT</h1>

                <h2>
                    EXAMINATION & RESULT<br>
                    MANAGEMENT SYSTEM
                </h2>

                <div class="yellow-line"></div>

                <p class="description">
                    A simple, efficient and reliable
                    computer based testing system
                    for students and institutions.
                </p>

            </div>


            <!-- Illustration -->
            <div class="illustration">
                <img src="image.png" alt="Illustration">
            </div>

        </section>



        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-card">

                <h1>
                    Welcome Back! <span>👋</span>
                </h1>

                <p class="subtitle">
                    Enter your details to start your exam
                </p>


                <!-- Form -->
                <form action="exam instruct/einstruct.html">

                    <!-- Name -->
                    <div class="input-box">

                        <span class="input-icon">♙</span>

                        <input type="text" name="fullname" id="candidateName" placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- Exam Code -->
                    <div class="input-box">

                        <span class="input-icon">⚙</span>

                        <select name="subject" title="Select your subject" placeholder="Select your subject" required>
                            <option value="" disabled selected>Select your subject</option>
                            <option value="math">Mathematics</option>
                            <option value="english">English</option>
                            <option value="science">Science</option>
                            <option value="art">Art</option>
                            <option value="current_affairs">Current Affairs</option>
                            <option value="general_knowledge">General Knowledge</option>
                        </select>

                    </div>


                    <!-- Start Exam -->
                    <button class="start-btn" type="submit">
                        <span>Start Exam</span>
                        <span class="arrow">→</span>
                    </button>



                </form>


                <!-- OR -->
                <div class="or">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- Results -->
                <a href="henry's-part/result.html" class="result-btn-link" style="text-decoration: none;">
                    <button class="result-btn" type="button">
                        <span class="result-icon">▥</span>
                        <span>View My Results</span>
                    </button>
                </a>

            </div>

        </section>

    </main>

    <script>
        // Store candidate info on start exam
        const loginForm = document.querySelector("form");
        if (loginForm) {
            loginForm.addEventListener("submit", function (e) {
                const nameInput = document.getElementById("candidateName");
                const subjectSelect = document.querySelector("select[name='subject']");
                if (nameInput && nameInput.value.trim()) {
                    localStorage.setItem("cbt_candidate_name", nameInput.value.trim());
                }
                if (subjectSelect && subjectSelect.value) {
                    const selected = subjectSelect.value;
                    localStorage.setItem("cbt_selected_subject", selected);

                    // Clear previous exam state if starting a different subject
                    try {
                        const saved = localStorage.getItem("cbt_exam_state");
                        if (saved) {
                            const parsed = JSON.parse(saved);
                            if (parsed.subject !== selected) {
                                localStorage.removeItem("cbt_exam_state");
                            }
                        }
                    } catch (err) {
                        localStorage.removeItem("cbt_exam_state");
                    }
                }
            });
        }
    </script>
</body>

</html>
