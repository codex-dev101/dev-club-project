<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CBT Examination System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body>

    <main class="container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">
                    <img src="logo.png" alt="Logo">
                </div>

                <div>
                    <h2>Smart CBT</h2>
                    <p>Examination System</p>
                </div>
            </div>


            <!-- Introduction -->
            <div class="intro">

                <h1>SMART CBT</h1>

                <h2>
                    EXAMINATION & RESULT<br>
                    MANAGEMENT SYSTEM
                </h2>

                <div class="yellow-line"></div>

                <p class="description">
                    A simple, efficient and reliable
                    computer based testing system
                    for students and institutions.
                </p>

            </div>


            <!-- Illustration -->
            <div class="illustration">
                <img src="image.png" alt="Illustration">
            </div>

        </section>



        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-card">

                <h1>
                    Welcome Back! <span>👋</span>
                </h1>

                <p class="subtitle">
                    Enter your details to start your exam
                </p>


                <!-- Form -->
                <form action="exam instruct/einstruct.html">

                    <!-- Name -->
                    <div class="input-box">

                        <span class="input-icon"><i class="fa-solid fa-user"></i></span>

                        <input type="text" name="fullname" id="candidateName" placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- Exam Code -->
                    <div class="input-box">

                        <span class="input-icon"><i class="fa-solid fa-book-open"></i></span>

                        <select name="subject" title="Select your subject" placeholder="Select your subject" required>
                            <option value="" disabled selected>Select your subject</option>
                            <option value="math">Mathematics</option>
                            <option value="english">English</option>
                            <option value="science">Science</option>
                            <option value="art">Art</option>
                            <option value="current_affairs">Current Affairs</option>
                            <option value="general_knowledge">General Knowledge</option>
                        </select>

                    </div>


                    <!-- Start Exam -->
                    <button class="start-btn" type="submit">
                        <span>Start Exam</span>
                        <i class="fa-solid fa-arrow-right arrow"></i>
                    </button>



                </form>


                <!-- OR -->
                <div class="or">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- Results -->
                <a href="henry's-part/result.html" class="result-btn-link">
                    <button class="result-btn" type="button">
                        <span class="result-icon"><i class="fa-solid fa-chart-column"></i></span>
                        <span>View My Results</span>
                    </button>
                </a>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
