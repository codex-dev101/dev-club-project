<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart CBT Examination System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- LEFT SIDE -->
        <section class="left-side">

            <!-- Logo -->
            <div class="logo">
                <div class="logo-icon">🎓</div>

                <div>
                    <h2>Smart CBT</h2>
                    <p>Examination System</p>
                </div>
            </div>


            <!-- Introduction -->
            <div class="intro">

                <h1>SMART CBT</h1>

                <h2>
                    EXAMINATION & RESULT<br>
                    MANAGEMENT SYSTEM
                </h2>

                <div class="yellow-line"></div>

                <p class="description">
                    A simple, efficient and reliable
                    computer based testing system
                    for students and institutions.
                </p>

            </div>


            <!-- Illustration -->
            <div class="illustration">
                <img src="image.png" alt="Illustration">
            </div>

        </section>



        <!-- RIGHT SIDE -->
        <section class="right-side">

            <div class="login-card">

                <h1>
                    Welcome Back! <span>👋</span>
                </h1>

                <p class="subtitle">
                    Enter your details to start your exam
                </p>


                <!-- Form -->
                <form>

                    <!-- Name -->
                    <div class="input-box">

                        <span class="input-icon">♙</span>

                        <input type="text" placeholder="Enter your full name">

                    </div>


                    <!-- Exam Code -->
                    <div class="input-box">

                        <span class="input-icon">⚙</span>

                        <select name="subject" title="Select your subject" placeholder="Select your subject">
                            <option value="" disabled selected>Select your subject</option>
                            <option value="math">Mathematics</option>
                            <option value="english">English</option>
                            <option value="science">Science</option>
                            <option value="art">Art</option>
                            <option value="current_affairs">Current Affairs</option>
                            <option value="general_knowledge">General Knowledge</option>
                        </select>

                    </div>


                    <!-- Start Exam -->
                    <a href="https://github.com/ilokaharrisonarinze/dev-club-project/blob/dev/exam%20instruct/einstruct.html">
                   <button class="start-btn" type="submit">
                        <span>Start Exam</span>
                        <span class="arrow">→</span>
                    </button>   
                    </a>


                </form>


                <!-- OR -->
                <div class="or">

                    <span></span>

                    <p>OR</p>

                    <span></span>

                </div>


                <!-- Results -->
                <button class="result-btn">

                    <span class="result-icon">▥</span>

                    <span>View My Results</span>

                </button>

            </div>

        </section>

    </main>

</body>

</html>
