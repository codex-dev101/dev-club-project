<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Results</title>

    <link rel="stylesheet" href="result.css">
</head>

<body>
 <main class="results-container">
  <h1>My Results</h1>
  <p class="description">
            Here are your all-time exam results.
  </p>
  <table> 
        <thead>
            <tr>
            <th>Exam Title</th>
            <th>Date Taken</th>
            <th>Score</th>
            <th>Grade</th>
            <th>Action</th>
            <th>Correct Answers</th>
            </tr>
        </thead>
     <tbody id="resultsTable">
            </tbody>
     </table>
     <div class="message">
            ⓘ Keep practicing and improving your skills. You're doing great! 🚀
     </div>
 </main>

<script src="result.js"></script>
</body>
</html>
